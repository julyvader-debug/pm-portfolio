name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pricing-monitor:
    name: Pricing monitor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pricing_monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pricing_monitor/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest tests/unit tests/integration -q
