[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pricing-monitor"
version = "0.1.0"
description = "Automated competitor price monitoring for veterinary e-commerce"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.44.0",
    "anthropic>=0.28.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "sqlite-utils>=3.35",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: marks tests as live (deselect with '-m \"not live\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pricing_monitor*"]
